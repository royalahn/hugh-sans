<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#111726"/>
    </linearGradient>

    <!-- Subtle Ambient Glows -->
    <radialGradient id="glow-blue" cx="15%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#4285F4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#4285F4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-green" cx="85%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#34A853" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#34A853" stop-opacity="0"/>
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Google Sans", sans-serif; font-size: 46px; font-weight: 800; fill: url(#text-grad); letter-spacing: -0.5px; }
    .badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 400; fill: #94A3B8; }
    .pill-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; }
    .pill-value { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 12px; font-weight: 500; }
  </style>

  <!-- Card Background -->
  <rect width="800" height="260" rx="16" fill="url(#bg)"/>
  <rect width="800" height="260" rx="16" fill="url(#glow-blue)"/>
  <rect width="800" height="260" rx="16" fill="url(#glow-green)"/>
  <rect width="798" height="258" x="1" y="1" rx="15" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Top Pill Tag -->
  <g transform="translate(48, 38)">
    <rect width="112" height="24" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <circle cx="14" cy="12" r="4" fill="#4285F4"/>
    <text x="26" y="16" fill="#93C5FD" class="badge">Typography</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="48" y="108" class="title">Hugh Sans</text>
  <text x="48" y="138" class="subtitle">Geometric elegance with balanced Windows line-spacing &amp; web optimization.</text>

  <!-- Comparison Metric Cards -->
  <!-- Before Card -->
  <g transform="translate(48, 172)">
    <rect width="210" height="52" rx="10" fill="#181216" stroke="#4C1D24" stroke-width="1"/>
    <circle cx="20" cy="26" r="5" fill="#EF4444"/>
    <text x="34" y="23" fill="#FCA5A5" class="pill-label">Original Metrics</text>
    <text x="34" y="41" fill="#7F1D1D" class="pill-value">Win Height: 2402 (240%)</text>
  </g>

  <!-- Arrow -->
  <g transform="translate(272, 190)">
    <path d="M 0 8 L 14 8 M 10 3 L 15 8 L 10 13" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- After Card -->
  <g transform="translate(302, 172)">
    <rect width="210" height="52" rx="10" fill="#0D1E17" stroke="#14532D" stroke-width="1"/>
    <circle cx="20" cy="26" r="5" fill="#22C55E"/>
    <text x="34" y="23" fill="#86EFAC" class="pill-label">Hugh Sans Patched</text>
    <text x="34" y="41" fill="#166534" class="pill-value">Win Height: 1252 (125%)</text>
  </g>

  <!-- Modern Accent Deco Dots on right side -->
  <g transform="translate(680, 50)" opacity="0.8">
    <circle cx="10" cy="10" r="2.5" fill="#38BDF8"/>
    <circle cx="30" cy="10" r="2.5" fill="#38BDF8" opacity="0.4"/>
    <circle cx="50" cy="10" r="2.5" fill="#38BDF8" opacity="0.2"/>
    <circle cx="10" cy="30" r="2.5" fill="#38BDF8" opacity="0.6"/>
    <circle cx="30" cy="30" r="2.5" fill="#38BDF8" opacity="0.3"/>
    <circle cx="50" cy="30" r="2.5" fill="#38BDF8" opacity="0.1"/>
    <circle cx="10" cy="50" r="2.5" fill="#38BDF8" opacity="0.4"/>
    <circle cx="30" cy="50" r="2.5" fill="#38BDF8" opacity="0.2"/>
    <circle cx="50" cy="50" r="2.5" fill="#38BDF8" opacity="0.1"/>
  </g>
</svg>
